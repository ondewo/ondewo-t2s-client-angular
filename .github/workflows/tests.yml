name: tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  auth-unit-tests:
    name: Keycloak auth surface unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      # tests/hand-written-barrel-location.spec.ts reads ng-packagr's `dest` out of the
      # proto-compiler's own ng-package.json instead of hard-coding it, so that one file has
      # to be present. Checking the compiler out standalone at the tag the Makefile pins keeps
      # the heavy `src/ondewo-t2s-api` submodule out of the job.
      - name: Resolve the proto-compiler tag the Makefile pins
        id: proto-compiler
        run: |
          ref="$(sed -nE 's#^ONDEWO_PROTO_COMPILER_GIT_BRANCH=(tags/)?##p' Makefile)"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out ondewo-proto-compiler at the pinned tag
        uses: actions/checkout@v5
        with:
          repository: ondewo/ondewo-proto-compiler
          ref: ${{ steps.proto-compiler.outputs.ref }}
          path: ondewo-proto-compiler

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint with type-checked eslint
        run: make eslint

      - name: Run all tests with coverage (100% global gate from jest.config.js)
        run: npx jest --config jest.config.js --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
